[project]
name = "video2book-ai-llm"
version = "0.1.0"
description = "Video2Book core engine: YouTube video/playlist -> PDF book"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "faster-whisper>=1.0.0",
    # book.epub / book.md exports (app/export.py)
    "Markdown>=3.5",
    # traces the vision calls, which bypass LangChain (app/llm.py _post_vision)
    "langsmith>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
