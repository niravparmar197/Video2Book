[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "api.routers", "api.jobs"]

[project]
name = "video2book-backend"
version = "0.1.0"
description = "Video2Book backend: FastAPI + PostgreSQL + BullMQ wrapping ai_llm's graph.py"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "bullmq>=2.0.0",
    "pydantic[email]>=2.0.0",
    "boto3>=1.34.0",
    "sentry-sdk>=2.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
